services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local-docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
